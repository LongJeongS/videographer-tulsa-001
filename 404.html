<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <!-- PORTFOLIO ARCHETYPE: 404 page. Rendered by stage4_assemble.render_404_override()
       instead of the generated trades 404 when design_context.archetype == "portfolio". -->
  <title>Page not found | Tulsa Video Productions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    :root { --ink: #1C2126; --accent: #2540B8; --paper: #FFFFFF; }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; background: var(--paper); color: var(--ink);
           font-family: 'Instrument Sans', "Helvetica Neue", Arial, sans-serif; font-size: 1.125rem; line-height: 1.6; -webkit-font-smoothing: antialiased; }
    main { padding: clamp(3rem, 8vw, 6rem) clamp(20px, 4vw, 64px); max-width: 1360px; margin-inline: auto; width: 100%; }
    .kicker { font-family: 'Instrument Serif', "Iowan Old Style", "Times New Roman", serif; color: var(--accent); font-size: clamp(3rem, 8vw, 6rem); line-height: 1; margin: 0 0 1rem; }
    h1 { font-family: 'Instrument Serif', "Iowan Old Style", "Times New Roman", serif; font-weight: 400; font-size: clamp(2.25rem, 5vw, 4rem); line-height: 1.02; letter-spacing: -0.01em; margin: 0 0 1.25rem; max-width: 14em; text-wrap: balance; }
    p { margin: 0 0 2rem; max-width: 30em; }
    a.button { display: inline-block; background: var(--accent); color: #fff; font-weight: 500; font-size: 1.0625rem; line-height: 1; padding: 1rem 1.5rem; border-radius: 999px; text-decoration: none; }
    a.button:hover { background: color-mix(in srgb, var(--accent) 78%, black); }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <p class="kicker">404</p>
    <h1>That page isn't here.</h1>
    <p>It may have moved, or the address may be off by a character. The home page has everything, including the work.</p>
    <a class="button" href="/">Back to Tulsa Video Productions</a>
  </main>
</body>
</html>
